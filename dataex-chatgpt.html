de{padding:8px 10px}#request-text{font-size:12px;font-weight:400;margin:4px 0;color:#64748b}#request-guide button{font-size:12px}
    #review-summary{display:flex;align-items:center;overflow:hidden;font-size:11px;gap:0}.review-filename{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.review-counts{flex-shrink:0;white-space:nowrap}#review-summary .review-filename{flex:1}
    #review-header::before{content:'';position:absolute;top:-24px;left:-24px;right:-24px;bottom:0;background:#fff;z-index:-1}

  .compatibility-label{font-size:11px;color:#64748b;margin-left:8px}.analysis-status-card{padding:10px 12px;margin:10px 0;background:#f8fafc;border-left:3px solid #cbd5e1;border-radius:5px;font-size:13px;overflow-wrap:anywhere}.analysis-status-card p{margin:4px 0 8px}.analysis-action{font-size:13px}.related-evidence,.search-audit{font-size:12px;margin:10px 0;overflow-wrap:anywhere}.related-evidence h4{font-size:12px;margin:8px 0}.related-item{padding:8px;border:1px solid #e2e8f0;border-radius:5px;margin:6px 0}.related-item button{font-size:12px}.review-state{border-top:1px solid #e2e8f0;padding-top:10px}#review-summary{flex-wrap:wrap;row-gap:4px}.review-counts{white-space:normal;flex-shrink:1}
  #profile-bar{font-size:12px;margin:0 0 12px;display:flex;align-items:center;flex-wrap:wrap;gap:8px}#profile-bar p{flex-basis:100%;margin:0}#profile-bar button{font-size:12px;padding:4px 10px}#profile-dialog{width:min(720px,92vw);max-height:88vh;overflow:auto;border:1px solid #cbd5e1;border-radius:12px;padding:24px;color:#1e293b}#profile-dialog::backdrop{background:#0f172a66}#profile-dialog h2{margin-top:0}#profile-dialog label{display:block;margin:12px 0;font-size:13px}#profile-dialog input:not([type=checkbox]),#profile-dialog textarea,#profile-dialog select{box-sizing:border-box;display:block;width:100%;padding:8px;margin-top:4px;border:1px solid #cbd5e1;border-radius:5px;font:inherit}#profile-dialog input[type=checkbox]{width:auto;margin:0 8px}#profile-dialog fieldset{min-width:0;border:1px solid #ddd6fe;border-radius:8px;margin:14px 0;padding:12px}#profile-dialog details{background:#f8fafc;padding:12px;border-radius:6px;margin:12px 0}#profile-dialog p{font-size:13px;overflow-wrap:anywhere}.profile-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}#profile-message{color:#9a3412}#profile-save{margin:14px 0;background:#6d28d9;color:white}#profile-dialog button{font-size:13px}#profile-dialog summary{cursor:pointer}

<body>
<header><h1>DataEx</h1><div class="header-actions"><a href="index.html">DataEx ホーム</a><details class="diagnostics"><summary>診断</summary><div id="webmcp-status" class="status" role="status">site tools: 未検出</div><div id="app-version" class="status"></div><p class="status">PDF本体は保存・送信しません。必要な本文と抽出結果はツール応答でWorkと共有します。条件・結果・確認状態はこのブラウザに保存します。</p></details></div></header>
<main>
  <aside id="conditions-pane">
    <div id="review-header" hidden><p id="review-summary"></p><div class="review-header-actions"><button id="toggle-conditions" type="button" aria-expanded="false" aria-controls="condition-content">抽出条件を表示</button><button id="erase-results" type="button">この結果を消去</button></div></div>
    <div id="restore-notice" class="hint" hidden>原著PDFを再選択すると根拠を表示できます <button id="reselect-pdf" type="button">原著PDFを再選択</button></div>
    <div id="storage-message" class="message" role="status"></div>
    <div id="condition-content">
    <h2>抽出条件</h2>
    <div id="drop-zone" class="drop-zone"><strong>PDF</strong><input id="pdf-file" type="file" accept="application/pdf,.pdf" hidden><button id="choose-pdf" type="button">PDFを選択</button><p class="hint">ここにドラッグ＆ドロップできます</p><p class="hint">PDFと抽出結果はこのブラウザ内で処理します。</p></div>
    <div id="pdf-status" class="message" role="status">PDFを読み込んでください。</div>
    <form id="conditions">
      <label for="intervention">Intervention</label><input id="intervention" placeholder="例：介入群・治療名" maxlength="2000">
      <label for="comparator">Comparator</label><input id="comparator" placeholder="例：対照群・比較治療" maxlength="2000">
      <label for="outcomes">Outcomes <span class="hint">（1行に1つ）</span></label><textarea id="outcomes" rows="3" placeholder="例：&#10;Pain intensity&#10;Quality of life" maxlength="8000"></textarea>
      <label for="timepoint">Timepoint</label><input id="timepoint" placeholder="例：12 weeks" maxlength="2000">
      <details><summary>Advanced</summary><label for="population-rule">Population rule</label><textarea id="population-rule" rows="2" maxlength="4000" placeholder="対象集団の条件"></textarea><label for="extra-rules">Extra rules</label><textarea id="extra-rules" rows="3" maxlength="4000" placeholder="追加ルール"></textarea></details>
      <button class="primary" type="submit">データ抽出</button><div id="extract-message" class="message" role="status"></div>
    <div id="request-guide" hidden><p id="request-text">このDataExを抽出してください</p><button id="copy-request" type="button">指示をコピー</button></div></form>
    </div><section id="results-section" class="future"><h2>抽出結果</h2><p id="results-empty" class="hint">抽出結果はここに表示されます</p><div id="result-cards"></div></section>
  </aside>
  <div id="pane-resizer" role="separator" tabindex="0" aria-label="左右ペインの幅" aria-orientation="vertical" aria-controls="conditions-pane" aria-valuemin="320" aria-valuenow="320"></div>
  <section class="viewer-pane" aria-label="PDFビューア">
    <div class="toolbar"><form id="search-form" class="searchbar"><input id="pdf-query" aria-label="PDF検索" placeholder="PDF内を検索" maxlength="200"><button type="submit">検索</button></form><button id="clear-highlight" type="button">解除</button><label for="page-number">ページ</label><input id="page-number" type="number" min="1" value="1"><span id="page-total">/ 0</span><button id="zoom-out" type="button" aria-label="縮小">−</button><span id="zoom-value">100%</span><button id="zoom-in" type="button" aria-label="拡大">＋</button></div>
    <div id="evidence-bar"><div id="evidence-message" class="message" role="status"></div><nav id="evidence-navigation" aria-label="根拠の切替"></nav></div><div id="search-results" class="results" aria-label="検索結果"></div><div id="pdf-viewer" class="viewer"><div class="empty">右側にPDFが表示されます</div></div>
  </section>
</main>
</body>
</html>
