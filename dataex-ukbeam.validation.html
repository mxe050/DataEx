<!doctype html><html lang="ja"><meta charset="utf-8"><title>UK BEAM 保存済みRaw 受入テスト</title>
<style>body{font-family:system-ui;max-width:900px;margin:30px auto;padding:15px}textarea{width:100%;height:130px}button{padding:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere}.pass{color:#196441}.fail{color:#922}</style>
<h1>UK BEAM 保存済みRawの検証</h1><p>検証用コピーのみ。PDFの解析や再抽出、Review Workspaceへの書込みは行いません。</p>
<label for="raw-input">保存済みRaw JSON</label><textarea id="raw-input"></textarea>
<label for="visual-input">保存済みVisual候補 JSON（任意）</label><textarea id="visual-input"></textarea>
<button id="run">保存済みデータで受入テスト</button><pre id="result" role="status">未実行</pre>
<script src="dataex-ico-mapping.js"></script><script src="dataex-results-model.js"></script><script src="dataex-effect-type.js"></script><script src="dataex-arm-ontology.js"></script><script src="dataex-paper-model.js"></script><script src="dataex-decisions.js"></script><script src="dataex-ukbeam-checks.js"></script>
<script>
document.querySelector('#run').onclick=async()=>{
 const out=document.querySelector('#result');try{const raw=JSON.parse(document.querySelector('#raw-input').value),original=JSON.stringify(raw),visual=document.querySelector('#visual-input').value;
 const report=runUKBeamChecks(raw);const hex=async s=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))).map(b=>b.toString(16).padStart(2,'0')).join('');
 report.rawHashBefore=await hex(original);report.rawHashAfter=await hex(JSON.stringify(raw));report.visualInputUnchanged=visual===document.querySelector('#visual-input').value;report.visualHash=await hex(visual);
 out.textContent=JSON.stringify(report,null,2);out.className='pass';}catch(e){out.textContent=e.stack;out.className='fail';}
};
</script></html>
