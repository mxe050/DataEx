<!doctype html><html lang="ja"><meta charset="utf-8"><title>DataEx Workspace バックアップ・復元</title>
<style>body{font:15px system-ui;max-width:980px;margin:24px auto;padding:16px}button,select,input{font:inherit;margin:6px;padding:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5f9;padding:14px}label{display:block}</style>
<h1>DataEx Workspace バックアップ・復元</h1>
<p>このブラウザの http://127.0.0.1:8766 のDataExデータだけが対象です。PDF抽出・外部通信・既存データの削除は行いません。復元は存在しないDB・設定キーに限ります。</p>
<h2>保存</h2><button id="inventory">保存先を確認</button><select id="db" aria-label="バックアップするDB"></select><button id="backup">選択DBを保存</button><button id="settings">DataExの設定を保存</button>
<h2>復元</h2><label>保存したファイル <input id="file" type="file" accept=".json,.gz"></label>
<label>復元先 <select id="mode"><option value="test">検証専用DB（元Workspaceには触れない）</option><option value="original">新PC：元のDB名へ（既存DBがあれば停止）</option></select></label>
<button id="restore" disabled>このファイルを復元・照合</button><pre id="status" role="status">保存先を確認してください。</pre>
<script>
'use strict';
const el=id=>document.getElementById(id), status=el('status'), TEST='dataex-recovery-test-20260920-', FORMAT='DataEx-disaster-recovery-v1';let pending=null,busy=false;
const relevant=s=>/^dataex(?:[-:]|$)/i.test(s)&&!s.startsWith(TEST);
const hash=async text=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text))),x=>x.toString(16).padStart(2,'0')).join('');
const b64=a=>{let s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(s);};
const bytes=s=>Uint8Array.from(atob(s),x=>x.charCodeAt(0));
async function encode(value){const blobs=[];function walk(v){if(v===null)return ['null'];if(v===undefined)return ['undefined'];if(typeof v==='string'||typeof v==='boolean')return [typeof v,v];if(typeof v==='number')return ['number',Object.is(v,-0)?'-0':Number.isFinite(v)?v:String(v)];if(typeof v==='bigint')return ['bigint',String(v)];if(v instanceof Date)return ['date',v.toISOString()];if(v instanceof Blob){const tag=[v instanceof File?'file':'blob',null,v.type,v.name||null,v.lastModified||null];blobs.push([v,tag]);return tag;}if(v instanceof ArrayBuffer)return ['buffer',b64(new Uint8Array(v))];if(ArrayBuffer.isView(v))return ['view',v.constructor.name,b64(new Uint8Array(v.buffer,v.byteOffset,v.byteLength))];if(Array.isArray(v))return ['array',v.map(walk)];if(v instanceof Map)return ['map',[...v].map(([k,x])=>[walk(k),walk(x)])];if(v instanceof Set)return ['set',[...v].map(walk)];if(Object.getPrototypeOf(v)===Object.prototype||Object.getPrototypeOf(v)===null)return ['object',Object.entries(v).map(([k,x])=>[k,walk(x)])];throw Error('未対応の保存型: '+v.constructor?.name);}const result=walk(value);for(const [v,tag] of blobs)tag[1]=b64(new Uint8Array(await v.arrayBuffer()));return result;}
function decode(v){const [t,x,y,z,w]=v;switch(t){case'null':return null;case'undefined':return undefined;case'string':case'boolean':return x;case'number':return typeof x==='number'?x:x==='-0'?-0:Number(x);case'bigint':return BigInt(x);case'date':return new Date(x);case'blob':return new Blob([bytes(x)],{type:y});case'file':return new File([bytes(x)],z,{type:y,lastModified:w});case'buffer':return bytes(x).buffer;case'view':{const types={Uint8Array,Int8Array,Uint16Array,Int16Array,Uint32Array,Int32Array,Float32Array,Float64Array,Uint8ClampedArray,DataView,BigInt64Array,BigUint64Array};if(!types[x])throw Error('未対応の数値配列');return new types[x](bytes(y).buffer);}case'array':return x.map(decode);case'object':return Object.fromEntries(x.map(([k,a])=>[k,decode(a)]));case'map':return new Map(x.map(([k,a])=>[decode(k),decode(a)]));case'set':return new Set(x.map(decode));default:throw Error('保存型が不正');}}
async function capture(meta){return new Promise((resolve,reject)=>{const q=indexedDB.open(meta.name,meta.version);q.onupgradeneeded=()=>{q.transaction.abort();reject(Error('対象DBがありません'));};q.onerror=()=>reject(q.error);q.onsuccess=()=>{const db=q.result,names=[...db.objectStoreNames],data={version:db.version,stores:{}};if(!names.length){db.close();resolve(data);return;}const tx=db.transaction(names,'readonly');tx.onabort=()=>{db.close();reject(tx.error||Error('読取失敗'));};tx.oncomplete=()=>{db.close();resolve(data);};for(const name of names){const s=tx.objectStore(name),a=s.getAll(),k=s.getAllKeys();data.stores[name]={keyPath:s.keyPath,autoIncrement:s.autoIncrement,indexes:[...s.indexNames].map(n=>{const i=s.index(n);return{name:n,keyPath:i.keyPath,unique:i.unique,multiEntry:i.multiEntry};})};a.onsuccess=()=>data.stores[name].values=a.result;k.onsuccess=()=>data.stores[name].keys=k.result;}};});}
function settings(){return Object.fromEntries(Object.keys(localStorage).filter(relevant).sort().map(k=>[k,localStorage.getItem(k)]));}
async function save(data,name){const text=JSON.stringify(data),stream=new Blob([text]).stream().pipeThrough(new CompressionStream('gzip')),blob=await new Response(stream).blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name+'.json.gz';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);return blob.size;}
async function run(fn){if(busy)return;busy=true;try{await fn();}catch(e){status.textContent='停止: '+e.message;}finally{busy=false;}}
el('inventory').onclick=()=>run(async()=>{const list=(await indexedDB.databases()).filter(x=>relevant(x.name)).sort((a,b)=>a.name.localeCompare(b.name));el('db').replaceChildren(...list.map(d=>{const o=document.createElement('option');o.value=d.name;o.textContent=d.name+' / v'+d.version;return o;}));status.textContent=JSON.stringify({origin:location.origin,databases:list,settingsKeys:Object.keys(settings()),testDatabasesExcluded:true},null,2);});
el('backup').onclick=()=>run(async()=>{const name=el('db').value,meta=(await indexedDB.databases()).find(d=>d.name===name);if(!meta||!relevant(name))throw Error('DataEx DBを選択してください');status.textContent=name+' を読み取り専用で退避しています…';const raw=await capture(meta),payload=await encode(raw),sha256=await hash(JSON.stringify(payload));if(sha256!==await hash(JSON.stringify(await encode(await capture(meta)))))throw Error('退避中に内容が更新されました。再度保存してください');const size=await save({format:FORMAT,kind:'database',name,origin:location.origin,capturedAt:new Date().toISOString(),sha256,payload},'DataEx-recovery-'+name);status.textContent=JSON.stringify({result:'保存完了・2回の読み取りが一致',name,sha256,gzipBytes:size,stores:Object.fromEntries(Object.entries(raw.stores).map(([k,s])=>[k,{records:s.values.length,indexes:s.indexes.length}]))},null,2);});
el('settings').onclick=()=>run(async()=>{const payload=await encode(settings()),sha256=await hash(JSON.stringify(payload));const size=await save({format:FORMAT,kind:'settings',name:'dataex-settings',origin:location.origin,capturedAt:new Date().toISOString(),sha256,payload},'DataEx-recovery-settings');status.textContent=JSON.stringify({result:'設定保存完了',sha256,keys:Object.keys(settings()).length,gzipBytes:size},null,2);});
el('file').onchange=()=>run(async()=>{pending=null;el('restore').disabled=true;const file=el('file').files[0];if(!file)return;const text=file.name.endsWith('.gz')?await new Response(file.stream().pipeThrough(new DecompressionStream('gzip'))).text():await file.text();const d=JSON.parse(text);if(d.format!==FORMAT||!['database','settings'].includes(d.kind)||!relevant(d.name)||await hash(JSON.stringify(d.payload))!==d.sha256)throw Error('形式・ハッシュ不一致');const raw=decode(d.payload);if(d.kind==='database'&&(!Number.isInteger(raw.version)||!raw.stores||Object.values(raw.stores).some(s=>s.keys.length!==s.values.length)))throw Error('DB形式不一致');pending={d,raw};el('restore').disabled=false;status.textContent=JSON.stringify({result:'読込・ハッシュ確認済み。まだ復元していません。',name:d.name,kind:d.kind,sha256:d.sha256},null,2);});
el('restore').onclick=()=>run(async()=>{if(!pending)throw Error('ファイルを選択してください');const {d,raw}=pending,test=el('mode').value==='test',name=test?TEST+d.name:d.name;if(location.origin!=='http://127.0.0.1:8766')throw Error('127.0.0.1:8766から開いてください');if(d.kind==='settings'){const rows=Object.entries(raw).map(([k,v])=>[test?TEST+k:k,v]);if(rows.some(([k])=>localStorage.getItem(k)!==null))throw Error('既存の設定キーがあるため停止（上書きしません）');const written=[];try{for(const[k,v]of rows){localStorage.setItem(k,v);written.push(k);}if(rows.some(([k,v])=>localStorage.getItem(k)!==v))throw Error('保存内容不一致');}catch(e){for(const k of written)localStorage.removeItem(k);throw e;}status.textContent=JSON.stringify({result:'PASS: 設定を復元・照合',test,keys:rows.length},null,2);return;}
if((await indexedDB.databases()).some(x=>x.name===name))throw Error('既存DBがあるため停止（上書きしません）');status.textContent=name+' を新規作成・トランザクションで復元中…';await new Promise((resolve,reject)=>{const q=indexedDB.open(name,raw.version);let created=false;q.onupgradeneeded=event=>{if(event.oldVersion>0){q.transaction.abort();return;}created=true;const db=q.result;try{for(const[n,s]of Object.entries(raw.stores)){const o=db.createObjectStore(n,{keyPath:s.keyPath,autoIncrement:s.autoIncrement});for(const i of s.indexes)o.createIndex(i.name,i.keyPath,{unique:i.unique,multiEntry:i.multiEntry});s.values.forEach((v,j)=>s.keyPath===null?o.add(v,s.keys[j]):o.add(v));}}catch(e){q.transaction.abort();reject(e);}};q.onerror=()=>reject(q.error);q.onblocked=()=>reject(Error('別画面がDBを利用中'));q.onsuccess=()=>{q.result.close();created?resolve():reject(Error('競合する既存DBを検出'));};});const restored=await capture({name,version:raw.version}),sha256=await hash(JSON.stringify(await encode(restored)));if(sha256!==d.sha256)throw Error('復元後のハッシュ不一致');status.textContent=JSON.stringify({result:'PASS: DB復元・全レコード・索引・値のハッシュ一致',name,test,sha256},null,2);});
</script></html>
